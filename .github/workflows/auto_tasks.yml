name: MotorMind Auto Tasks

on:
  schedule:
    - cron: '0 22 * * *'  # 06:00 CST (UTC 22:00 prev day)
    - cron: '0 1 * * *'   # 09:00 CST (UTC 01:00)
    - cron: '0 2 * * *'   # 10:00 CST (UTC 02:00)
    - cron: '0 9 * * 5'   # 17:00 CST Fri (UTC 09:00 Fri)
  workflow_dispatch:

jobs:
  auto-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies (no requirements.txt)
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl requests apscheduler python-dotenv

      - name: Create directories
        run: mkdir -p backups reports

      - name: Run automation
        run: |
          cd "项目管理/P-001_代码模板"
          python scripts/run_auto_tasks.py
        continue-on-error: true

      - name: Backup
        if: always()
        run: |
          mkdir -p backups
          if [ -f "项目管理/P-001_代码模板/recruitment.db" ]; then
            cp "项目管理/P-001_代码模板/recruitment.db" "backups/db_$(date +%s).db"
          fi

      - name: Git sync
        if: always()
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Bot"
          git add -A || true
          git commit -m "Auto: $(date)" || true
          git push || true
