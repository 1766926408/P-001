name: MotorMind Auto Tasks

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 9 * * 5'
  workflow_dispatch:

jobs:
  auto-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Setup environment
        run: |
          echo "# Empty requirements file" > requirements.txt
          pip install --upgrade pip
          pip install pandas openpyxl requests apscheduler python-dotenv

      - name: Run automation
        run: |
          cd 项目管理/P-001_代码模板
          python -B -u scripts/run_auto_tasks.py
        env:
          PYTHONDONTWRITEBYTECODE: 1

      - name: Backup and sync
        if: always()
        run: |
          mkdir -p backups
          if [ -f 项目管理/P-001_代码模板/recruitment.db ]; then
            cp 项目管理/P-001_代码模板/recruitment.db backups/db_$(date +%s).db
          fi
          git config --local user.email "bot@github.com"
          git config --local user.name "Bot"
          git add -A || true
          git commit -m "auto sync $(date)" || true
          git push || true
