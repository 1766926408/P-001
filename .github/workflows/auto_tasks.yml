name: MotorMind Auto Tasks

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 9 * * 5'
  workflow_dispatch:

jobs:
  auto-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install and run
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl requests apscheduler python-dotenv
          cd 项目管理/P-001_代码模板
          python scripts/run_auto_tasks.py
        shell: bash
        continue-on-error: true

      - name: Save results
        if: always()
        run: |
          mkdir -p backups
          [ -f 项目管理/P-001_代码模板/recruitment.db ] && cp 项目管理/P-001_代码模板/recruitment.db backups/db_$(date +%s).db || true
        shell: bash

      - name: Sync to GitHub
        if: always()
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Bot"
          git add -A || true
          git commit -m "sync" || true
          git push || true
        shell: bash
