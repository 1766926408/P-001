name: MotorMind Auto Tasks

on:
  schedule:
    # 早6点 - 计算激励积分
    - cron: '0 6 * * *'
    # 早9点 - 发放激励通知
    - cron: '0 9 * * *'
    # 早10点 - 同步表单数据
    - cron: '0 10 * * *'
    # 周五17点 - 生成周报
    - cron: '0 17 * * 5'
  # 支持手动触发
  workflow_dispatch:

jobs:
  auto-tasks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled tasks
        env:
          TASK_TYPE: scheduled
          DATABASE_PATH: recruitment.db
        run: |
          # 根据当前时间执行相应任务
          python scripts/run_auto_tasks.py

      - name: Backup database
        if: always()
        run: |
          # 每次执行后备份数据库
          cp recruitment.db "backups/recruitment_$(date +%Y%m%d_%H%M%S).db" 2>/dev/null || true

      - name: Commit changes
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Auto-sync data: $(date +'%Y-%m-%d %H:%M:%S')" || true

      - name: Push changes
        if: always()
        run: |
          git push origin main || true
